<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WebSocket Monitor</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        min-height: 100vh;
        background: #0a0a0a;
        color: #e5e5e5;
        font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
      }

      .wrap {
        width: 100%;
        max-width: 640px;
        display: flex;
        flex-direction: column;
        gap: 18px;
      }

      h1 {
        font-size: 14px;
        font-weight: 400;
        letter-spacing: 3px;
        text-transform: uppercase;
        color: #555;
      }

      #status {
        font-size: 12px;
        letter-spacing: 1px;
        padding: 10px 14px;
        border-radius: 10px;
        background: #111;
        border: 1px solid #1f1f1f;
        display: flex;
        align-items: center;
        gap: 10px;
      }

      #status::before {
        content: "";
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: currentColor;
        box-shadow: 0 0 10px currentColor;
      }

      .status-on {
        color: #4ade80;
      }
      .status-off {
        color: #f87171;
      }

      form {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
      }

      input {
        flex: 1 1 200px;
        padding: 12px 14px;
        background: #0f0f0f;
        border: 1px solid #1f1f1f;
        border-radius: 10px;
        color: #e5e5e5;
        font-family: inherit;
        font-size: 13px;
        outline: none;
        transition: border-color 0.15s;
      }

      input:focus {
        border-color: #4ade80;
      }
      input::placeholder {
        color: #444;
      }

      button {
        padding: 12px 16px;
        border-radius: 10px;
        border: 1px solid #1f1f1f;
        background: #111;
        color: #e5e5e5;
        font-family: inherit;
        font-size: 12px;
        letter-spacing: 1px;
        text-transform: uppercase;
        cursor: pointer;
        transition:
          background 0.15s,
          border-color 0.15s;
      }

      button:hover:not(:disabled) {
        background: #1a1a1a;
        border-color: #2a2a2a;
      }
      button:disabled {
        opacity: 0.3;
        cursor: not-allowed;
      }

      button[type="submit"] {
        background: #4ade80;
        border-color: #4ade80;
        color: #0a0a0a;
        font-weight: 700;
      }

      button[type="submit"]:hover:not(:disabled) {
        background: #22c55e;
        border-color: #22c55e;
      }

      #log {
        background: #0f0f0f;
        border: 1px solid #1f1f1f;
        border-radius: 10px;
        padding: 16px;
        height: 300px;
        overflow-y: auto;
        font-size: 12px;
        line-height: 1.8;
        white-space: pre-wrap;
        word-break: break-word;
        color: #888;
      }

      #log::-webkit-scrollbar {
        width: 6px;
      }
      #log::-webkit-scrollbar-thumb {
        background: #222;
        border-radius: 3px;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <h1>WebSocket Monitor</h1>
      <div id="status" class="status-off">Connecting...</div>

      <form id="message-form">
        <input
          id="message-input"
          type="text"
          placeholder="send cargo..."
          required
          autocomplete="off"
        />
        <button type="submit">Send</button>
        <button type="button" id="disconnect" disabled>Off</button>
        <button type="button" id="reconnect" disabled>On</button>
      </form>

      <pre id="log"></pre>
    </div>

    <script>
      const statusEl = document.getElementById("status");
      const log = document.getElementById("log");
      const input = document.getElementById("message-input");
      const form = document.getElementById("message-form");
      const disconnectBtn = document.getElementById("disconnect");
      const reconnectBtn = document.getElementById("reconnect");

      let socket = null;

      const appendLog = (label, message) => {
        const time = new Date().toLocaleTimeString();
        log.textContent += `[${time}] ${label} ${message}\n`;
        log.scrollTop = log.scrollHeight;
      };

      function setupSocket() {
        socket = new WebSocket("ws://localhost:3000");

        socket.addEventListener("open", () => {
          statusEl.textContent = "CONNECTED";
          statusEl.className = "status-on";
          appendLog("[SYSTEM]", "Tunnel established.");
          disconnectBtn.disabled = false;
          reconnectBtn.disabled = true;
        });

        socket.addEventListener("message", (event) => {
          appendLog("[RECV]", event.data);
        });

        socket.addEventListener("close", () => {
          statusEl.textContent = "DISCONNECTED";
          statusEl.className = "status-off";
          appendLog("[SYSTEM]", "Tunnel collapsed.");
          disconnectBtn.disabled = true;
          reconnectBtn.disabled = false;
        });

        socket.addEventListener("error", () => {
          appendLog("[ERROR]", "Connection error.");
        });
      }

      setupSocket();

      disconnectBtn.addEventListener("click", () => {
        if (socket) socket.close();
      });

      reconnectBtn.addEventListener("click", () => {
        if (socket) {
          socket.onopen = null;
          socket.onmessage = null;
          socket.onclose = null;
          socket.onerror = null;
        }
        setupSocket();
      });

      form.addEventListener("submit", (e) => {
        e.preventDefault();
        if (!socket || socket.readyState !== WebSocket.OPEN) {
          appendLog("[ERROR]", "No active tunnel.");
          return;
        }
        const msg = input.value.trim();
        if (msg) {
          socket.send(msg);
          appendLog("[SEND]", msg);
          input.value = "";
        }
      });
    </script>
  </body>
</html>
